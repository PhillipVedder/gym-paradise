name: Feature idea
description: Suggest an improvement to the gym-building experience.
title: 'Idea: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the task or frustration before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
      description: Include alternatives or examples if useful.
    validations:
      required: true
